<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }
  
  .breatheText {
    position: absolute;
    left: 50%;
    top: calc(40% - 100px);
    transform: translateX(-50%);

    z-index: 3;

    color: white;
    font-family: serif;
    font-size: 48px;
    letter-spacing: 4px;

    opacity: 0.85;

    animation: breatheText 3s infinite ease-in-out;
  }
  
  #container {
    display: none;
    width: 100vw;
    height: 100vh;
    position: fixed;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 999;
    pointer-events: none;
  }
  
  #container.active {
    display: flex;
  }
  
  .circle {
    border-radius: 50%;
    background-color: aquamarine;
    width: 150px;
    height: 150px;
    position: absolute;
    z-index: 1;
    opacity: 0;
    animation: scaleIn 4s infinite cubic-bezier(.36, .11, .89, .32);
  }
  
  .item {
    position: relative;
    z-index: 2;
    top: 25px;
    padding: 5px;
  }

  .item img {
    width: 150px;
  }
  
  @keyframes scaleIn {
    0% {transform: scale(.5, .5); opacity: .5;}
    100% {transform: scale(2.5, 2.5); opacity: 0;}
  }
  
  @keyframes breatheText {
  0% {
    transform: translateX(-50%) scale(0.97);
    opacity: 0.55;
  }

  50% {
    transform: translateX(-50%) scale(1.03);
    opacity: 1;
  }

  100% {
    transform: translateX(-50%) scale(0.97);
    opacity: 0.55;
  }
}
  
</style>

<body>
  <div id="outerContainer">
    <div id="container">
      <div class="breatheText">BREATHE</div>
      
      <div class="item">
        <img src="./balloon.png"/>
      </div>
      <div class="circle" style="animation-delay: -3s"></div>
      <div class="circle" style="animation-delay: -2s"></div>
      <div class="circle" style="animation-delay: -1s"></div>
      <div class="circle" style="animation-delay: 0s"></div>
    </div>
  </div>
</body>

<script>
/* global nn */
  let canvas, ctx
  progress = 0
  const THETA_MULTIPLIER = 0.5
  const SPACING_MULTIPLIER = 3
  let wordChangeRate = 60;
  let isMouseDown = false;
  
  let stage1Text = [
  "family values",
  "true christian",
  "truth",
  "wake up",
  "look closer",
  "high value",
  "hidden",
  "close borders",
  "question",
  "listen",
  "research",
  "cancel culture",
  "commie",
  "deep state",
  "virtue signalling",
  "notice",
  "freedom of speech",
  "neoliberal"
];

let stage2Text = [
  "they lied",
  "open your eyes",
  "wake them up",
  "you see it now",
  "black on black crime",
  "climate denial",
  "masculinity crisis",
  "woke",
  "chad",
  "feminist agenda",
  "the matrix",
  "not a coincidence",
  "both parties are corrupt",
  "the system",
  "trust no one",
  "the others",
  "fake news",
  "proof everywhere",
  "everyone is blind",
  "follow the pattern",
  "they are afraid",
  "no going back"
];

let stage3Text = [
  "Looksmaxxing",
  "OBEY",
  "TRUTH???",
  "NO NO NO",
  "MAGA",
  "ONLY US",
  "WAKE WAKE WAKE",
  "CONTROL",
  "STATIC",
  "SIGNAL",
  "PATTERN PATTERN",
  "EYES OPEN",
  "NO EXIT",
  "REPEAT",
  "BELIEVE",
  "THE LOOP",
  "INSIDE",
  "AGAIN AGAIN",
  "skjdoasnviod",
  "///TRUTH///",
  "ERROR",
  "NULL",
  "010101",
  "THE CENTER",
  "LOUDER",
  "NOISE",
  "ALL TRUE",
  "ALL FALSE",
  "SEE SEE SEE"
];
  
  function setup() {
    nn.get('body').css('margin', 0)
    
    canvas = nn.create('canvas')
      .position(0, 0)
      .resize(nn.width, nn.height)
      .addTo('body')
    
    ctx = canvas.getContext('2d')
    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)'; 
    ctx.shadowBlur = 10;                
    ctx.shadowOffsetX = 5;  
    
    canvas.addEventListener("mousedown", () => {
      isMouseDown = true;
    });

    window.addEventListener("mouseup", () => {
      isMouseDown = false;
    });
  }
  
  function resize () {
    canvas.resize(nn.width, nn.height)
    // anything that should update
    // when page resizes, goes here
  }
  
  function drawSpiral(gap, progress) {
    // midpoint in canvas
    cx = nn.width / 2
    cy = nn.height / 2 
    
    //Save state and move origin to the center
    ctx.save();
    ctx.translate(cx, cy);
    
    //Start path
    ctx.beginPath();
    ctx.lineWidth = 2;
    
    let angle = 0;
    let currentGap = 0;
    
    // time since page started, will slowly change spiral
    const t = performance.now() * 0.0001 

    // Loop to draw many points over time
    for (let i = 0; i < progress; i++){
      // playing around with the rotation value theta led 
      // to the dynamic shapes. At low values it was just a spiral
      const theta = i * t * THETA_MULTIPLIER; //this affects how tight the turns are
      const spacing = theta * SPACING_MULTIPLIER; // Radius from center
      
      angle += 0.1;
      currentGap += gap / 100
      
      //I use either angle and currentGap or theta and spacing
      //convert the coordinates to canvas coordinates
      const x = Math.cos(theta) * spacing;
      const y = Math.sin(theta) * spacing;
      
      ctx.lineTo(x,y); 
    }
    
    ctx.stroke(); //draw the line
    ctx.restore(); //return to most recent state
  }
  
  function touchGrass() {
    pulse = document.getElementById("container");
    pulse.classList.add("active");
  }
  
  function hideGrass () {
    pulse = document.getElementById("container");
    pulse.classList.remove("active");
  }

  function draw() {
    requestAnimationFrame(draw)
    
    if (isMouseDown) {
      //don't draw spiral
      touchGrass();
      canvas.style.display = "none";
      progress = 0;
      return;
    } else {
      canvas.style.display = "";
      hideGrass();
    }
    
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, nn.width, nn.height);
    
    //control how many points in spiral there are
    progress += 1;
    
    let words;
  
    canvas.style.display = ""
    if (progress < 1000) {
      words = stage1Text;
      ctx.strokeStyle = 'pink';
    } else if (progress < 3000) {
      words = stage2Text;
      ctx.strokeStyle = 'orange';
    } else {
      words = stage3Text;
      ctx.strokeStyle = 'red';
    }

    
    if (progress % wordChangeRate === 0) {
      currentWord = words[Math.floor(Math.random() * words.length)];
    }
    
    ctx.font = "40px serif";
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    drawSpiral(30, progress);
    ctx.fillText(currentWord, nn.width/2, nn.height/2)
  }
  
  nn.on('load', setup)
  nn.on('resize', resize)
  nn.on('load', draw)
</script>

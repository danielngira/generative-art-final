<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>
<script>
/* global nn */
  let canvas, ctx
  progress = 0
  const THETA_MULTIPLIER = 0.5
  const SPACING_MULTIPLIER = 3
  let wordChangeRate = 60;
  let isMouseDown = false;
  
  let groundingText = [
  "pause",
  "breathe",
  "reflect",
  "step back",
  "verify",
  "think",
  "question the feed",
  "log off",
  "slow down",
  "talk to someone",
  "check sources",
  "be careful"
];
  
  let stage1Text = [
  "watch",
  "learn",
  "truth",
  "wake up",
  "look closer",
  "just curious",
  "one more",
  "interesting",
  "hidden",
  "question",
  "listen",
  "research",
  "connect",
  "notice",
  "follow"
];

let stage2Text = [
  "they lied",
  "open your eyes",
  "enemy",
  "corrupt",
  "wake them up",
  "you see it now",
  "not a coincidence",
  "they know",
  "the system",
  "trust no one",
  "controlled",
  "betrayed",
  "the others",
  "fake news",
  "proof everywhere",
  "everyone is blind",
  "follow the pattern",
  "they are afraid",
  "no going back"
];

let stage3Text = [
  "PURE",
  "OBEY",
  "9999",
  "TRUTH???",
  "NO NO NO",
  "THEY KNOW",
  "ONLY US",
  "WAKE WAKE WAKE",
  "CONTROL",
  "STATIC",
  "SIGNAL",
  "PATTERN PATTERN",
  "EYES OPEN",
  "NO EXIT",
  "REPEAT",
  "BELIEVE",
  "THE LOOP",
  "INSIDE",
  "AGAIN AGAIN",
  "///TRUTH///",
  "ERROR",
  "NULL",
  "010101",
  "THE CENTER",
  "LOUDER",
  "NOISE",
  "ALL TRUE",
  "ALL FALSE",
  "SEE SEE SEE"
];
  
  function setup() {
    nn.get('body').css('margin', 0)
    

    
    canvas = nn.create('canvas')
      .position(0, 0)
      .resize(nn.width, nn.height)
      .addTo('body')
    
    ctx = canvas.getContext('2d')
    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)'; 
    ctx.shadowBlur = 10;                
    ctx.shadowOffsetX = 5;  
    
    canvas.addEventListener("mousedown", () => {
      isMouseDown = true;
    });

    window.addEventListener("mouseup", () => {
      isMouseDown = false;
    });
  }
  
  function resize () {
    canvas.resize(nn.width, nn.height)
    // anything that should update
    // when page resizes, goes here
  }
  
  function drawSpiral(gap, progress) {
    // midpoint in canvas
    cx = nn.width / 2
    cy = nn.height / 2 
    
    //Save state and move origin to the center
    ctx.save();
    ctx.translate(cx, cy);
    
    //Start path
    ctx.beginPath();
    ctx.lineWidth = 2;
    
    let angle = 0;
    let currentGap = 0;
    
    // time since page started, will slowly change spiral
    const t = performance.now() * 0.0001 

    // Loop to draw many points over time
    for (let i = 0; i < progress; i++){
      // playing around with the rotation value theta led 
      // to the dynamic shapes. At low values it was just a spiral
      const theta = i * t * THETA_MULTIPLIER; //this affects how tight the turns are
      const spacing = theta * SPACING_MULTIPLIER; // Radius from center
      
      angle += 0.1;
      currentGap += gap / 100
      
      //I use either angle and currentGap or theta and spacing
      //convert the coordinates to canvas coordinates
      const x = Math.cos(theta) * spacing;
      const y = Math.sin(theta) * spacing;
      
      ctx.lineTo(x,y); 
    }
    
    ctx.stroke(); //draw the line
    ctx.restore(); //return to most recent state
  }
  //
  function draw() {
    requestAnimationFrame(draw)
    
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, nn.width, nn.height);
    
    //control how many points in spiral there are
    progress += 1;
    
    let words;

    if (isMouseDown) {
        words = groundingText;
        ctx.strokeStyle = 'green';
    } else{
      if (progress < 1000) {
        words = stage1Text;
        ctx.strokeStyle = 'pink';
      } else if (progress < 2000) {
        words = stage2Text;
        ctx.strokeStyle = 'orange';
      } else {
        words = stage3Text;
        ctx.strokeStyle = 'red';
      }
    }
    
    if (progress % wordChangeRate === 0) {
      currentWord = words[Math.floor(Math.random() * words.length)];
    }
    
    ctx.font = "40px serif";
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    drawSpiral(30, progress);
    ctx.fillText(currentWord, nn.width/2, nn.height/2)
  }
  
  nn.on('load', setup)
  nn.on('resize', resize)
  nn.on('load', draw)
</script>
